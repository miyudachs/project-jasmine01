<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿アプリ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 家計簿アプリ</h1>
            <p class="subtitle">収支を簡単に管理</p>
        </header>

        <div class="summary">
            <div class="summary-card income">
                <h3>収入</h3>
                <p class="amount" id="totalIncome">¥0</p>
            </div>
            <div class="summary-card expense">
                <h3>支出</h3>
                <p class="amount" id="totalExpense">¥0</p>
            </div>
            <div class="summary-card balance">
                <h3>残高</h3>
                <p class="amount" id="balance">¥0</p>
            </div>
        </div>

        <div class="form-container">
            <h2>新規登録</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="type">種類</label>
                    <select id="type" required>
                        <option value="income">収入</option>
                        <option value="expense">支出</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">カテゴリー</label>
                    <select id="category" required>
                        <option value="給与">給与</option>
                        <option value="副業">副業</option>
                        <option value="食費">食費</option>
                        <option value="交通費">交通費</option>
                        <option value="娯楽">娯楽</option>
                        <option value="光熱費">光熱費</option>
                        <option value="通信費">通信費</option>
                        <option value="医療費">医療費</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">金額</label>
                    <input type="number" id="amount" placeholder="1000" min="0" required>
                </div>

                <div class="form-group">
                    <label for="description">メモ</label>
                    <input type="text" id="description" placeholder="詳細を入力（任意）">
                </div>

                <div class="form-group">
                    <label for="date">日付</label>
                    <input type="date" id="date" required>
                </div>

                <button type="submit" class="btn-submit">登録</button>
            </form>
        </div>

        <div class="transactions-container">
            <div class="transactions-header">
                <h2>取引履歴</h2>
                <button id="clearAll" class="btn-clear">全削除</button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="income">収入</button>
                <button class="filter-btn" data-filter="expense">支出</button>
            </div>
            <div id="transactionsList" class="transactions-list">
                <p class="no-data">まだ取引がありません</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
